[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microstation-mcp"
version = "1.0.0"
description = "Enterprise-grade Model Context Protocol (MCP) Server for Bentley MicroStation V8i"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pillow>=12.3.0",
    "pywin32>=306",
]

[project.scripts]
microstation-mcp = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
